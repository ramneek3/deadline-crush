# One command for everything:  docker compose up --build
# Web http://localhost:5173 · API http://localhost:4000 · MinIO console http://localhost:9001
services:
  mongo:
    image: mongo:7
    volumes: [mongo:/data/db]
    ports: ["27017:27017"]

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [minio:/data]
    ports: ["9000:9000", "9001:9001"]

  api:
    build: ./server
    command: ["npx", "tsx", "src/api/main.ts"]
    environment: &env
      MONGO_URL: mongodb://mongo:27017/deadline_crush
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000 # what the browser uses for signed URLs
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: submissions
      JWT_SECRET: change-me-in-real-deployments
      CORS_ORIGIN: http://localhost:5173
      S3_CORS_ORIGINS: http://localhost:5173
    ports: ["4000:4000"]
    depends_on: [mongo, redis, minio]

  worker:
    build: ./server
    command: ["npx", "tsx", "src/worker/main.ts"]
    environment: *env
    depends_on: [mongo, redis, minio]
    deploy:
      replicas: 2 # the queue is built for several workers

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:4000
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  mongo:
  redis:
  minio:
